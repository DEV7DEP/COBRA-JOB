<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Job Assistant</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.n.jsscript>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#4B0082;
}

button{
background:#4B0082;
color:white;
border:none;
padding:10px 20px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#6A0DAD;
}

textarea{
width:100%;
height:200px;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th,
table td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

table th{
background:#4B0082;
color:white;
}

.score-high{
color:green;
font-weight:bold;
}

.score-medium{
color:orange;
font-weight:bold;
}

.score-low{
color:red;
font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>🤖 AI Job Assistant</h1>

<h2>1. Importer votre CV</h2>

<input type="file" id="cvFile" accept=".pdf">

<button onclick="readPDF()">
Analyser CV
</button>

<textarea id="cvText"></textarea>

<h2>2. Offres trouvées</h2>

<button onclick="searchJobs()">
Rechercher des offres
</button>

<table>

<thead>
<tr>
<th>Entreprise</th>
<th>Poste</th>
<th>Score</th>
<th>Action</th>
</tr>
</thead>

<tbody id="jobsTable"></tbody>

</table>

<h2>3. Lettre générée</h2>

<textarea id="coverLetter"></textarea>

</div>

<script>

let cvContent = "";

async function readPDF(){

const file =
document.getElementById('cvFile').files[0];

if(!file){
alert("Choisissez un PDF");
return;
}

const reader = new FileReader();

reader.onload = async function(){

const typedArray =
new Uint8Array(this.result);

const pdf =
await pdfjsLib.getDocument(
typedArray
).promise;

let text = '';

for(let i=1;i<=pdf.numPages;i++){

const page =
await pdf.getPage(i);

const content =
await page.getTextContent();

text += content.items
.map(item => item.str)
.join(' ') + '\n';
}

cvContent = text;

document.getElementById(
'cvText'
).value = text;
};

reader.readAsArrayBuffer(file);
}

function searchJobs(){

const jobs = [

{
company:"SNCF",
title:"Ingénieur Supply Chain"
},

{
company:"GEODIS",
title:"Responsable Logistique"
},

{
company:"RLE",
title:"Coordinateur Flux"
},

{
company:"Amazon",
title:"Process Engineer"
},

{
company:"DHL",
title:"Lean Manager"
}

];

const table =
document.getElementById(
'jobsTable'
);

table.innerHTML = '';

jobs.forEach(job => {

const score =
Math.floor(
Math.random()*40
)+60;

let colorClass='score-high';

if(score<80)
colorClass='score-medium';

if(score<70)
colorClass='score-low';

table.innerHTML += `
<tr>
<td>${job.company}</td>
<td>${job.title}</td>
<td class="${colorClass}">
${score}%
</td>
<td>
<button onclick="
generateLetter(
'${job.company}',
'${job.title}'
)">
Générer
</button>
</td>
</tr>
`;

});
}

function generateLetter(
company,
title
){

const letter =

`Objet : Candidature au poste de ${title}

Madame, Monsieur,

Actuellement professionnel dans le domaine de la logistique et de la gestion des flux, je souhaite intégrer ${company} au poste de ${title}.

Mes compétences en amélioration continue, gestion de stock, Kanban, Lean Manufacturing et Supply Chain me permettent de contribuer efficacement à la performance opérationnelle.

Rigoureux, autonome et orienté résultats, je suis particulièrement motivé à rejoindre votre équipe.

Je reste à votre disposition pour un entretien.

Cordialement`;

document.getElementById(
'coverLetter'
).value = letter;
}

</script>

</body>
</html>
